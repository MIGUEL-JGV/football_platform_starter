services:
  postgres:
    image: postgres:16-alpine
    container_name: football-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: football_platform
      POSTGRES_USER: football
      POSTGRES_PASSWORD: change_me_local
    ports:
      - "5432:5432"
    volumes:
      - football_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d football_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: football-platform-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://football:change_me_local@postgres:5432/football_platform?schema=public
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace-with-a-long-random-secret}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: football-platform-web
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:4000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  football_pgdata:
